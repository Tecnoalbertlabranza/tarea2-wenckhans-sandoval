services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: isoft-tarea2-app
    container_name: spring-boot-compras
    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"
    environment:
      - APP_PORT=${APP_PORT:-3001}
      - APP_ENV=production
      - CSV_PATH=/app/data/compras.csv
    volumes:
      - ./compras.csv:/app/data/compras.csv:ro
